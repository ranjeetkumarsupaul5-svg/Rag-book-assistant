<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RAG Assistant</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="app">

        <header class="header">
            <div>
                <h1>RAG Assistant</h1>
                <p>Upload your book and ask questions</p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                RAG Online
            </div>
        </header>


        <main class="chat-container">

            <!-- Upload Section -->
            <div class="upload-section">

                <h2>📚 Upload Your Book</h2>

                <p>
                    Upload a PDF book to start asking questions.
                </p>

                <div class="upload-box">

                    <input
                        type="file"
                        id="fileInput"
                        accept=".pdf"
                    >

                    <button
                        id="uploadButton"
                        onclick="uploadBook()"
                    >
                        Upload PDF
                    </button>

                </div>

                <p id="uploadStatus" class="upload-status"></p>

            </div>


            <!-- Chat Section -->
            <div id="chatBox" class="chat-box">

                <div class="message assistant">

                    <div class="avatar">AI</div>

                    <div class="message-content">
                        <p>
                            Hello! 👋<br><br>

                            First upload your PDF book.
                            Then you can ask questions about its content.
                        </p>
                    </div>

                </div>

            </div>


            <!-- Suggestions -->
            <div class="suggestions">

                <button onclick="askQuestion('What is this book about?')">
                    What is this book about?
                </button>

                <button onclick="askQuestion('Give me a summary of the book')">
                    Summarize the book
                </button>

                <button onclick="askQuestion('What are the main topics in this book?')">
                    Main topics
                </button>

            </div>


            <!-- Question Input -->
            <div class="input-area">

                <textarea
                    id="questionInput"
                    placeholder="Ask something about your book..."
                    rows="1"
                ></textarea>

                <button
                    id="sendButton"
                    onclick="sendQuestion()"
                >
                    Send
                </button>

            </div>


            <p class="footer-text">
                Powered by RAG • ChromaDB • Mistral Embeddings • Groq
            </p>

        </main>

    </div>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
